name: Worker Tests

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Run unit tests
        working-directory: worker
        run: npm test
